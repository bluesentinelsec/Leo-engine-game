<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo Pong - Web Build</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .container {
            max-width: 1200px;
            text-align: center;
        }
        
        canvas.emscripten {
            border: 2px solid #444;
            background: #000;
        }
        
        .controls {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 8px;
        }
        
        .status {
            margin: 10px 0;
            font-size: 14px;
        }
        
        .progress {
            width: 100%;
            height: 20px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Leo Pong</h1>
        <p>Leo Engine Lua Game - Web Build</p>
        
        <div class="controls">
            <strong>Controls:</strong><br>
            WASD/Arrow Keys: Move | +/-: Zoom | ESC: Quit<br>
            Mouse/Touch: Click to move | Space: Sound Test | M: Music
        </div>
        
        <div class="status" id="status">Loading...</div>
        <div class="progress">
            <div class="progress-bar" id="progress"></div>
        </div>
        
        <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
        
        <div style="margin-top: 20px; font-size: 12px; color: #888;">
            Built with Leo Engine | Powered by Emscripten
        </div>
    </div>

    <script type='text/javascript'>
        var statusElement = document.getElementById('status');
        var progressElement = document.getElementById('progress');
        var canvasElement = document.getElementById('canvas');

        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    console.log(text);
                };
            })(),
            canvas: canvasElement,
            // Request 60 FPS for smoother performance
            targetFps: 60,
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                var now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                statusElement.innerHTML = text;
                
                if (m) {
                    var progress = parseInt(m[2]) / parseInt(m[4]) * 100;
                    progressElement.style.width = progress + '%';
                } else if (text === '') {
                    progressElement.style.width = '100%';
                    statusElement.innerHTML = 'Ready to play!';
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };
        Module.setStatus('Downloading...');
        window.onerror = function() {
            Module.setStatus('Exception thrown, see JavaScript console');
            progressElement.style.width = '100%';
            progressElement.style.background = '#f44336';
        };
    </script>
    {{{ SCRIPT }}}
</body>
</html>
